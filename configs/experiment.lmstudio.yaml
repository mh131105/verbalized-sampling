# Experimento oficial do TP1 usando modelos locais via LM Studio e OpenAI API.
# Antes de executar, inicie o servidor local de chat do LM Studio em:
# http://localhost:1234/v1

run:
  run_id_prefix: "lmstudio"
  output_root: "results/runs"
  baseline_repetitions: 5

dataset:
  path: "data/messages.jsonl"
  min_messages: 20
  max_messages: 30
  required_categories:
    - pedido
    - cobranca
    - recusa
    - agradecimento
    - convite
    - esclarecimento
    - confirmacao
    - adiamento

generation_defaults:
  temperature: 0.6
  top_p: 0.95
  max_tokens: 220
  seed: 42

perplexity:
  enabled: true
  evaluator_model: "PORTULAN/gervasio-8b-portuguese-ptpt-decoder-quantized-4bit"
  max_length: 256

models:
  - model_id: "openai_gpt41_mini"
    provider: "openai"
    model_name: "gpt-4.1-mini"
    api_base: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    is_local: false
    backend: "openai"
    generation_params:
      seed: 101
    timeout: 240

  - model_id: "lmstudio_gemma_e2b"
    provider: "openai_compatible"
    model_name: "mlx-community/gemma-4-e2b-it"
    api_base: "http://localhost:1234/v1"
    is_local: true
    backend: "lmstudio"
    generation_params:
      seed: 202
    timeout: 240

  - model_id: "lmstudio_ministral_14b"
    provider: "openai_compatible"
    model_name: "ministral-3-14b-instruct-2512"
    api_base: "http://localhost:1234/v1"
    is_local: true
    backend: "lmstudio"
    generation_params:
      seed: 303
    timeout: 240

conditions:
  - condition_id: "baseline"
    condition_type: "baseline"
    prompt_id: "baseline"
    prompt_version: "v3"
    prompt_path: "data/prompts/baseline_v3.txt"
    system_message: "Voce e um assistente de escrita cuidadoso para mensagens cotidianas. Escreva apenas a resposta final."
    n_candidates: 1
    generation_params:
      temperature: 0.6
      top_p: 0.95
      max_tokens: 220

  - condition_id: "vs_intermediate"
    condition_type: "verbalized_sampling"
    prompt_id: "vs_intermediate"
    prompt_version: "v3"
    prompt_path: "data/prompts/vs_intermediate_v3.txt"
    system_message: "Voce e um assistente de escrita cuidadoso. Retorne um objeto JSON que siga o schema solicitado."
    n_candidates: 5
    vs_probability_mode: "full_distribution"
    generation_params:
      temperature: 0.6
      top_p: 0.95
      max_tokens: 700

  - condition_id: "vs_aggressive"
    condition_type: "verbalized_sampling"
    prompt_id: "vs_aggressive"
    prompt_version: "v3"
    prompt_path: "data/prompts/vs_aggressive_v3.txt"
    system_message: "Voce e um assistente de escrita cuidadoso. Retorne um objeto JSON que siga o schema solicitado."
    n_candidates: 5
    vs_probability_mode: "tail_distribution"
    probability_threshold: 0.1
    generation_params:
      temperature: 0.6
      top_p: 0.95
      max_tokens: 700
