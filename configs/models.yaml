# Alternative real-model configuration examples. Copy entries into
# configs/experiment.yaml when you are ready to run paid/local providers.
models:
  - model_id: "openai_gpt_4o_mini"
    provider: "openai_compatible"
    model_name: "gpt-4o-mini"
    api_base: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    is_local: false
    generation_params:
      temperature: 0.7
      top_p: 0.95
      max_tokens: 420

  - model_id: "openrouter_model"
    provider: "openai_compatible"
    model_name: "openai/gpt-4o-mini"
    api_base: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    is_local: false
    generation_params:
      temperature: 0.7
      top_p: 0.95
      max_tokens: 420

  - model_id: "ollama_llama"
    provider: "ollama"
    model_name: "llama3.1"
    api_base: "http://localhost:11434"
    is_local: true
    generation_params:
      temperature: 0.8
      top_p: 0.95
      max_tokens: 420

